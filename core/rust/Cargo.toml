[package]
name = "makterm_core"
version = "0.1.0"
edition = "2021"
description = "Native process supervisor for MakTerm"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
